name: Automated SEO Enrichment

on:
  schedule:
    # Runs twice daily at 03:17 UTC (10:17 WIB) and 15:17 UTC (22:17 WIB)
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of new candidate videos to enrich"
        required: false
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: seo-enrich
  cancel-in-progress: false

jobs:
  enrich:
    name: Enrich Videos to Neon DB
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check required repository secrets
        env:
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
        run: |
          if [ "$HAS_GEMINI" != "true" ]; then
            echo "::error::Missing GEMINI_API_KEY secret in GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ "$HAS_DB" != "true" ]; then
            echo "::error::Missing DATABASE_URL secret in GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Gemini SEO enrichment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
          GEMINI_BATCH_SIZE: ${{ vars.GEMINI_BATCH_SIZE || '5' }}
          ENFORCE_INDEXING_GATE: ${{ vars.ENFORCE_INDEXING_GATE || 'true' }}
        run: |
          LIMIT="${{ inputs.limit || '30' }}"
          npm run seo:enrich -- --limit="$LIMIT"

      - name: Print SEO enrichment report
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENFORCE_INDEXING_GATE: ${{ vars.ENFORCE_INDEXING_GATE || 'true' }}
        run: npm run seo:report
