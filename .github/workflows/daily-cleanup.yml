name: Daily Removed-Video Cleanup

on:
  schedule:
    # Runs once daily at 02:17 UTC (09:17 WIB) without 30s HTTP timeout limits
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore 20h cooldown and run cleanup immediately"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: daily-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Stream Removed Feed & Prune Neon DB
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check DATABASE_URL secret
        env:
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
        run: |
          if [ "$HAS_DB" != "true" ]; then
            echo "::error::Missing DATABASE_URL secret in GitHub repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run streaming removed-video cleanup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            npm run seo:cleanup -- --force
          else
            npm run seo:cleanup
          fi
